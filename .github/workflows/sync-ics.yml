name: Sync calendar feeds

on:
  schedule:
    # Daily 05:30 UTC — refresh the .ics feeds if fixtures/scores changed.
    - cron: "30 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/gen-ics.mjs"
      - "scripts/check-lzv-drift.mjs"
      - "src/utils/icsRevision.js"
      - "src/utils/calendarDrift.js"
      - "src/utils/lzvCalendar.js"
      - "src/seasons.js"
      - "src/constants.js"

# Read-only by default; only the job that pushes the feeds gets write access.
permissions:
  contents: read

# A push-triggered run overlapping the cron or a manual dispatch would race on `git push`.
# Queue instead of cancelling, so no day's feed is skipped.
concurrency:
  group: sync-ics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # FIRST, so today's feeds already carry the fix. Diffs LZV's live feed against `games` and fixes
      # what is safe by itself (owner, 2026-11-19): same-day time/hall changes in place (RSVPs kept),
      # a new date as a fresh row (RSVPs cleared), new fixtures added, ONE vanished upcoming fixture
      # deleted (postponed). Played/past games, several vanishing at once, and ambiguous matches are
      # left for a human with the SQL in the job summary. Before 2026-11-19 this step was read-only
      # and ran last — see HANDOVER.md 2026-09-04 for why the check exists at all.
      # continue-on-error so the feeds still regenerate; the last step turns it back into a failure.
      - name: Fix LZV fixture drift
        id: drift
        continue-on-error: true
        run: node scripts/check-lzv-drift.mjs --apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LZV_SEASON_SLUG: ${{ vars.LZV_SEASON_SLUG || '2627' }}
          LZV_OUR_TEAM_ID: ${{ vars.LZV_OUR_TEAM_ID || '742' }}

      - name: Generate calendar feeds
        run: node scripts/gen-ics.mjs
        env:
          # Reads are public; the anon (publishable) key is enough. Set these as repo
          # secrets (SUPABASE_URL already exists for the other sync jobs).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit feeds if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fixtures*.ics
          if git diff --staged --quiet; then
            echo "No fixture changes — feeds unchanged."
          else
            git commit -m "chore: refresh calendar feeds [skip ci]"
            # Something may have landed on main during the run; replay the feed commit on top
            # rather than failing non-fast-forward and not publishing today's feed.
            git pull --rebase
            git push
          fi

      # Fails on purpose when the drift step changed a fixture or left one for a human: the failed-run
      # email is the owner's notification (they asked for GitHub email, 2026-11-19). The job summary
      # says what was changed and what is left.
      - name: Notify on fixture changes
        if: always()
        run: |
          if [ "${{ steps.drift.outcome }}" = "failure" ]; then
            echo "::error::Fixture drift left for a human (or the check failed) — see the job summary."
            exit 1
          fi
          if [ "${{ steps.drift.outputs.applied }}" != "" ] && [ "${{ steps.drift.outputs.applied }}" != "0" ]; then
            echo "::error::Changed ${{ steps.drift.outputs.applied }} fixture(s) automatically — see the job summary."
            exit 1
          fi
          echo "No fixture changes."
