name: Sync opponent palmares

on:
  schedule:
    # Daily, 06:30 UTC. The current-season standings (position, pts/match,
    # played) feed the stats-page league table and change with every round
    # other teams play, so monthly left the table weeks out of date. The run
    # is ~20s and a dozen page fetches, so daily costs nothing.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install runtime deps
        run: npm install --omit=dev --no-audit --no-fund @supabase/supabase-js

      - name: Run palmares sync script
        run: node scripts/sync-palmares.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LZV_TEAM_URL: ${{ vars.LZV_TEAM_URL || 'https://www.lzvcup.be/teams/overview/742' }}
          LZV_OUR_TEAM_ID: ${{ vars.LZV_OUR_TEAM_ID || '742' }}
          LZV_SEASON_SLUG: ${{ vars.LZV_SEASON_SLUG || '2627' }}
