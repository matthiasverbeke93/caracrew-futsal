name: Weekly squad digest

on:
  schedule:
    # Friday 16:00 UTC (~17:00 Brussels winter)
    - cron: "0 16 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve recipients and print them without sending"
        type: boolean
        default: false

permissions:
  contents: read

# A manual dispatch overlapping the Friday cron would mail the squad twice. Serialise; the
# Resend idempotency key then drops the second run's repeats.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Kickoffs are stored as Brussels wall-clock time and the MotM window is computed from them
      # with local-time Date parsing. On the UTC runner that shifted every window by 1–2 hours.
      TZ: Europe/Brussels
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Send weekly digest
        run: npm run digest:weekly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Recipients come from players.auth_user_id -> auth.users. This var is now
          # only EXTRA addresses for people without an account.
          DIGEST_TO_EMAIL: ${{ vars.DIGEST_TO_EMAIL }}
          DIGEST_SKIP_EMAILS: ${{ vars.DIGEST_SKIP_EMAILS }}
          DIGEST_DRY_RUN: ${{ inputs.dry_run }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
          DIGEST_SEASON_SLUG: ${{ vars.LZV_SEASON_SLUG || '2627' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
